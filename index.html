<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RetroGames</h1>
        <p>Confira os pricipais jogos retrôs!</p>
    </header>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nossos jogos</h2>
                <p> Confira os jogos disponiveis</p>
            </div>
            <button id="btnCadastrar">Cadastrar</button>
        </div>
        <selection id="listarjogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </selection>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo jogo</h2>
        <form id="formJogo">
            <label for="id">ID</label>
            <input type="text" id="id" required>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>
            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" required>
            <label for="desenvolvedores">Desenvolvedores</label>
            <input type="text" id="dev" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="url" placeholder="https://site.com/jogo.jpg" required>
            <label for="">Preço do jogo</label>
            <input type="number" id="preco" min="0.01" step="0.01"required>
            <label for="">Data de Cadastro</label>
            <input type="date" id="data" required>
            <div class="acoes">
                <button type="button" id="btnCancelar">Cancelar</button>
                <button type="submit">Salvar Jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
